<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Sovereign AI Data Workbench</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div class="brand-copy">
          <strong>Sovereign</strong>
          <span>AI Data Workbench</span>
        </div>
      </div>

      <nav class="nav" aria-label="주요 메뉴">
        <button class="nav-item is-active" data-page="dashboard"><span class="nav-icon">⌂</span><span>Control Center</span></button>
        <button class="nav-item" data-page="projects"><span class="nav-icon">▦</span><span>Projects</span></button>
        <button class="nav-item" data-page="tasks"><span class="nav-icon">✓</span><span>Analysis Tasks</span></button>
        <button class="nav-item" data-page="recurring"><span class="nav-icon">↻</span><span>Recurring</span></button>
        <button class="nav-item" data-page="models"><span class="nav-icon">◇</span><span>Experiments & Models</span></button>
        <button class="nav-item" data-page="data"><span class="nav-icon">◫</span><span>Data Sources</span></button>
        <button class="nav-item" data-page="evidence"><span class="nav-icon">◎</span><span>Evidence & Eval</span></button>
        <button class="nav-item" data-page="providers"><span class="nav-icon">⚙</span><span>AI Accounts</span></button>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-label">Workspace</div>
        <button class="workspace-switcher" id="workspaceSwitcher">
          <span class="workspace-dot"></span>
          <span class="workspace-copy"><strong>Analytics Division</strong><small>8 active tasks</small></span>
          <span>⌄</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="security-card">
          <div class="security-head"><span class="status-dot status-ok"></span><strong>Restricted mode</strong></div>
          <p>External data egress is blocked for protected tasks.</p>
          <button class="text-button" data-open-modal="network">View policy</button>
        </div>
      </div>
    </aside>

    <section class="main-shell">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="메뉴 열기">☰</button>
        <div class="breadcrumb" id="breadcrumb">Control Center</div>
        <div class="topbar-actions">
          <div class="mode-pill" title="현재 배포 모드"><span class="status-dot status-ok"></span><span>Restricted Network</span></div>
          <label class="profile-select">
            <span>AI profile</span>
            <select id="globalProfile">
              <option>Local Analysis / Open-weight</option>
              <option>Personal AGY</option>
              <option>Personal Claude Code</option>
              <option>Personal Codex (quota blocked)</option>
            </select>
          </label>
          <button class="icon-button" aria-label="알림" id="notificationButton">3</button>
          <button class="avatar-button" aria-label="사용자 메뉴">SK</button>
        </div>
      </header>

      <main class="page" id="pageRoot" tabindex="-1"></main>
    </section>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <div><div class="eyebrow" id="modalEyebrow">Create</div><h2 id="modalTitle">New analysis task</h2></div>
        <button class="icon-close" id="modalClose" aria-label="닫기">×</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-footer" id="modalFooter"></footer>
    </section>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
