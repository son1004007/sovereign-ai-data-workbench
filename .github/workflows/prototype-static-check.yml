name: Publishing prototype static check

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-static-check.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-static-check.yml'

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check prototype/app.js
          node --check prototype/enhancements.js
          node --check prototype/korean-guide.js

      - name: Validate publishing contract
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('prototype')
          index = (root / 'index.html').read_text(encoding='utf-8')
          css = (root / 'styles.css').read_text(encoding='utf-8')
          guide_css = (root / 'guide.css').read_text(encoding='utf-8')
          app = (root / 'app.js').read_text(encoding='utf-8')
          ext = (root / 'enhancements.js').read_text(encoding='utf-8')
          guide = (root / 'korean-guide.js').read_text(encoding='utf-8')

          required_files = ['styles.css', 'guide.css', 'app.js', 'enhancements.js', 'korean-guide.js']
          for name in required_files:
              assert (root / name).is_file(), f'missing {name}'
              assert name in index, f'{name} is not referenced by index.html'

          required_markers = [
              'Control Center',
              'Analysis Tasks',
              'Recurring',
              'Experiments & Models',
              'Data Sources',
              'Analysis Recipes',
              'Evidence & Eval',
              'AI Accounts',
          ]
          for marker in required_markers:
              assert marker in index, f'missing navigation marker: {marker}'

          assert "connect-src 'none'" in index, 'publishing CSP must block browser network connections'
          assert 'noindex,nofollow,noarchive' in index, 'preview must remain noindex'
          assert 'data-page="recipes"' in index, 'recipe navigation is missing'
          assert "state.page === 'recipes'" in ext, 'recipe page router is missing'
          assert "tab === 'execution'" in ext, 'execution tab renderer is missing'
          assert "tab === 'results'" in ext, 'results tab renderer is missing'
          assert 'data-citation' in app and 'bbox-highlight' in app, 'citation-to-evidence interaction is missing'
          assert '이 기능이 없으면?' in guide, 'feature judgment guide is missing'
          assert '제안: 필수' in guide and '제안: 조건부' in guide, 'feature necessity labels are missing'
          assert '통합 관제' in guide and '분석 과제' in guide, 'Korean-first navigation mapping is missing'

          runtime_assets = {
              'index.html': index,
              'styles.css': css,
              'guide.css': guide_css,
              'app.js': app,
              'enhancements.js': ext,
              'korean-guide.js': guide,
          }
          external = re.compile(r'https?://', re.I)
          for name, content in runtime_assets.items():
              assert not external.search(content), f'external runtime URL found in {name}'

          print('publishing_contract=PASS')
          print('korean_guided_review=PASS')
          print('runtime_external_dependencies=0')
