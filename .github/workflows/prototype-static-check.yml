name: Publishing prototype static check

on:
  push:
    branches: [main, publishing-complete-2026-09-06]
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-static-check.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-static-check.yml'

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check prototype/app-v2.js
          node --check prototype/publishing-state-fix.js
          node --check prototype/mobile-nav-fix.js

      - name: Validate publishing contract
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('prototype')
          index = (root / 'index.html').read_text(encoding='utf-8')
          css = (root / 'styles-v2.css').read_text(encoding='utf-8')
          complete_css = (root / 'publishing-complete.css').read_text(encoding='utf-8')
          mobile_css = (root / 'mobile-nav-fix.css').read_text(encoding='utf-8')
          app = (root / 'app-v2.js').read_text(encoding='utf-8')
          state_fix = (root / 'publishing-state-fix.js').read_text(encoding='utf-8')
          mobile = (root / 'mobile-nav-fix.js').read_text(encoding='utf-8')
          spec = (root / 'UI_SPEC.md').read_text(encoding='utf-8')

          assert 'styles-v2.css' in index
          assert 'publishing-complete.css' in index
          assert 'mobile-nav-fix.css' in index
          assert 'app-v2.js' in index
          assert 'publishing-state-fix.js' in index
          assert 'mobile-nav-fix.js' in index
          assert 'app.js' not in index
          assert 'enhancements.js' not in index
          assert 'korean-guide.js' not in index
          assert "connect-src 'none'" in index
          assert 'noindex,nofollow,noarchive' in index

          for required in [
              '상호작용 정상',
              'data-decision',
              'data-task-tab',
              '통합 관제',
              '프로젝트',
              '분석 과제',
              '데이터 연결·검증',
              '분석 실행·결과',
              '결과·이력',
              '문서·수집 파이프라인',
              '근거·평가',
              '정기 분석',
              'ML 실험·모델',
              '분석 레시피',
              'AI 계정·모델 연결',
              'Experiments',
              'Models',
              'Reports',
              'data-doc-scenario',
              'permission-state',
              'Runtime egress NOT VERIFIED',
              'data-citation-id',
              'runEvalButton',
              'Backend 연결 후 등록',
          ]:
              assert required in app, f'missing publishing contract: {required}'

          # Scenario filtering must not leave a stale detail panel visible.
          assert '[data-doc-scenario]' in state_fix
          assert '[data-document-id]' in state_fix
          assert '선택할 문서가 없습니다.' in state_fix
          assert 'rows[0].click()' in state_fix

          for required in [
              'SCR-007',
              'SCR-008',
              'permission-denied',
              'disabled',
              'FR-DOC-001',
              'FR-CIT-001',
              'SEC-EGR-001',
          ]:
              assert required in spec, f'missing UI spec contract: {required}'

          for required in [
              '.doc-layout',
              '.scenario-bar',
              '.permission-state',
              '.ranking-table',
              '.eval-grid',
              '@media(max-width:700px)',
          ]:
              assert required in complete_css, f'missing completion style: {required}'

          assert "#nav [data-page]" in mobile
          assert "sidebar.classList.remove('open')" in mobile
          assert 'mobile-nav-backdrop' in mobile_css
          assert 'mobile-nav-open' in mobile_css

          external = re.compile(r'https?://', re.I)
          assets = {
              'index.html': index,
              'styles-v2.css': css,
              'publishing-complete.css': complete_css,
              'mobile-nav-fix.css': mobile_css,
              'app-v2.js': app,
              'publishing-state-fix.js': state_fix,
              'mobile-nav-fix.js': mobile,
          }
          for name, content in assets.items():
              assert not external.search(content), f'external runtime URL found in {name}'

          print('publishing_contract=PASS')
          print('screen_count_contract=12')
          print('task_detail_tabs=10')
          print('first_slice_document_states=PASS')
          print('document_state_detail_reconciliation=PASS')
          print('evidence_eval_interactions=PASS')
          print('single_primary_runtime_script=PASS')
          print('mobile_navigation_close_contract=PASS')
          print('runtime_external_dependencies=0')
