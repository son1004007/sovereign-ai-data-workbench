name: Publishing prototype static check

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-static-check.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-static-check.yml'

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check prototype/app-v2.js

      - name: Validate publishing contract
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('prototype')
          index = (root / 'index.html').read_text(encoding='utf-8')
          css = (root / 'styles-v2.css').read_text(encoding='utf-8')
          app = (root / 'app-v2.js').read_text(encoding='utf-8')

          assert 'styles-v2.css' in index
          assert 'app-v2.js' in index
          assert 'app.js' not in index
          assert 'enhancements.js' not in index
          assert 'korean-guide.js' not in index
          assert "connect-src 'none'" in index
          assert 'noindex,nofollow,noarchive' in index
          assert '상호작용 정상' in app
          assert "data-decision" in app
          assert "data-task-tab" in app
          assert "simulate-run" in app
          assert "citation" in app
          assert "정기 분석" in app
          assert "ML 실험·모델" in app
          assert "AI 계정·모델 연결" in app

          external = re.compile(r'https?://', re.I)
          for name, content in {'index.html':index,'styles-v2.css':css,'app-v2.js':app}.items():
              assert not external.search(content), f'external runtime URL found in {name}'

          print('publishing_contract=PASS')
          print('single_runtime_script=PASS')
          print('runtime_external_dependencies=0')
